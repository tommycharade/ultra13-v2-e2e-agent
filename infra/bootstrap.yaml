AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege AWS delivery identity and container registry for the Ultra13 V2 acceptance agent.

Parameters:
  GitHubOrganization:
    Type: String
    Default: tommycharade
  GitHubRepository:
    Type: String
    Default: ultra13-v2-e2e-agent
  GitHubOrganizationId:
    Type: String
    Default: "3448706"
  GitHubRepositoryId:
    Type: String
    Default: "1336942307"

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ultra13-v2-e2e-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Retain ten immutable acceptance images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaImagePull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ultra13-v2-e2e-agent

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ultra13-v2-e2e-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GitHubDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ultra13-v2-e2e-github
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}@${GitHubOrganizationId}/${GitHubRepository}@${GitHubRepositoryId}:*
      Policies:
        - PolicyName: deploy-one-acceptance-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ultra13-v2-e2e-agent
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  GitHubDeliveryRoleArn:
    Value: !GetAtt GitHubDeliveryRole.Arn
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
